[project]
name = "contimeter-api"
version = "0.1.0"
description = "HTTP access to Contimeter measurements"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pandas>=2.0,<4",
    "psycopg2-binary>=2.9,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=9.1,<10",
]